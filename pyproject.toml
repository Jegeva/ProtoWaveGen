[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protowavegen"
version = "0.1.0"
description = "Synthesize timing diagrams for embedded protocols to SVG and sigrok-compatible capture files"
requires-python = ">=3.10"
dependencies = [
    "svgwrite>=1.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
protowavegen = "protowavegen.main:main"

[tool.setuptools.packages.find]
where = ["src"]
